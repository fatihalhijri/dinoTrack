; Pool PHP-FPM khusus DinoTrack (docs/10-deploy.md). Salin ke /etc/php/8.4/fpm/pool.d/dinotrack.conf.
; Berjalan sebagai user dinotrack, sama dengan worker queue, cron, dan deploy, agar tidak ada
; bentrok izin di storage/ dan bootstrap/cache/.

[dinotrack]
user = dinotrack
group = dinotrack

listen = /run/php/php8.4-fpm-dinotrack.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; VPS 2 GB: ±60 MB per proses. Naikkan max_children bila RAM lebih besar.
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Sama dengan fastcgi_read_timeout Nginx.
request_terminate_timeout = 60s

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.4-fpm-dinotrack.log
