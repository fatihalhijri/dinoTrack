; Pengaturan PHP production DinoTrack (docs/10-deploy.md). Salin ke
; /etc/php/8.4/fpm/conf.d/99-dinotrack.ini dan /etc/php/8.4/cli/conf.d/99-dinotrack.ini
; (worker queue dan scheduler memakai PHP CLI).

expose_php = Off
display_errors = Off
log_errors = On

; Argumen fungsi tidak ikut stack trace di log (password router, token gateway; audit R-10).
zend.exception_ignore_args = On

memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M

; Kode hanya berubah lewat deploy.sh, yang me-reload PHP-FPM. Tidak berlaku untuk CLI
; (opcache.enable_cli bawaan Off), sehingga worker cukup queue:restart.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
