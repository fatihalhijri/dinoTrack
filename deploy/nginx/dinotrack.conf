# Nginx untuk DinoTrack (docs/10-deploy.md). Salin ke /etc/nginx/sites-available/dinotrack,
# ganti billing.example.com dengan domain sebenarnya, lalu aktifkan dengan symlink ke sites-enabled.
# File ini di-include di dalam blok http, sehingga map/limit_req_zone/log_format boleh di sini.

# Webhook Midtrans: batas per IP di depan PHP (aplikasi juga membatasi 120/menit, audit T-1).
limit_req_zone $binary_remote_addr zone=dinotrack_webhooks:10m rate=2r/s;

# Cek tagihan /isolir mengirim kode pelanggan dan 4 digit nomor WA lewat query string; jangan
# dicatat di access log (audit R-8). Referer juga tidak dicatat karena bisa memuat URL yang sama.
map $request_uri $dinotrack_log_uri {
    ~^/isolir\?  /isolir?[disamarkan];
    default      $request_uri;
}

log_format dinotrack '$remote_addr [$time_local] "$request_method $dinotrack_log_uri $server_protocol" '
                     '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream dinotrack_php {
    server unix:/run/php/php8.4-fpm-dinotrack.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name billing.example.com;
    server_tokens off;

    # Perpanjangan sertifikat Let's Encrypt (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Termasuk /isolir: perangkat terisolir diarahkan Mikrotik ke http://<domain>/isolir lalu ke
    # HTTPS, sehingga firewall isolir wajib mengizinkan port 443 ke domain ini.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name billing.example.com;
    server_tokens off;

    root /var/www/dinotrack/public;
    index index.php;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/billing.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billing.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:dinotrack_ssl:10m;
    ssl_session_timeout 1d;

    # Header lain (X-Frame-Options, nosniff, Referrer-Policy) dikirim aplikasi (AddSecurityHeaders).
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/dinotrack.access.log dinotrack;
    error_log /var/log/nginx/dinotrack.error.log warn;

    # Form admin; upload logo usaha (fase frontend) cukup beberapa MB.
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset Vite bernama hash: aman di-cache selamanya. add_header di sini menimpa milik server,
    # jadi HSTS diulang.
    location ^~ /build/ {
        try_files $uri =404;
        expires max;
        access_log off;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Langsung ke PHP (tanpa try_files) agar client_max_body_size di sini yang berlaku: batas
    # body dibaca di location terakhir, bukan location sebelum internal redirect.
    location ^~ /webhooks/ {
        client_max_body_size 16k;
        limit_req zone=dinotrack_webhooks burst=20 nodelay;
        limit_req_status 429;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass dinotrack_php;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        # Tes koneksi router menunggu hingga 15 detik; sisanya cadangan.
        fastcgi_read_timeout 60s;
        fastcgi_pass dinotrack_php;
    }

    # .env, .git, dan file tersembunyi lain tidak pernah disajikan.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
