; Queue worker DinoTrack (docs/10-deploy.md). Salin ke /etc/supervisor/conf.d/dinotrack-worker.conf
; lalu: sudo supervisorctl reread && sudo supervisorctl update
;
; Satu program per queue (App\Enums\QueueName) agar aktivasi setelah bayar tidak mengantre di
; belakang ratusan pesan WhatsApp (audit R-9). Timeout per job diatur di kelas job ($timeout)
; dan selalu lebih pendek dari retry_after 150 detik (dijaga ConfigTest).
;
; stopwaitsecs lebih lama dari timeout job terlama (job router 100 detik): saat deploy/restart,
; Supervisor menunggu job yang sedang berjalan selesai sebelum mematikan proses.

[program:dinotrack-default]
command=/usr/bin/php8.4 /var/www/dinotrack/backend/artisan queue:work redis --queue=default --sleep=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=dinotrack
directory=/var/www/dinotrack/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=130
redirect_stderr=true
stdout_logfile=/var/www/dinotrack/backend/storage/logs/worker-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Perintah router: lambat (hingga 100 detik saat router tidak terjangkau), jadi dua proses agar
; satu router mati tidak menahan aktivasi pelanggan di router lain.
[program:dinotrack-network]
command=/usr/bin/php8.4 /var/www/dinotrack/backend/artisan queue:work redis --queue=network --sleep=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=dinotrack
directory=/var/www/dinotrack/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=130
redirect_stderr=true
stdout_logfile=/var/www/dinotrack/backend/storage/logs/worker-network.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Pesan WhatsApp dibatasi 1 pesan / 5 detik untuk seluruh aplikasi; satu proses cukup.
[program:dinotrack-notifications]
command=/usr/bin/php8.4 /var/www/dinotrack/backend/artisan queue:work redis --queue=notifications --sleep=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=1
user=dinotrack
directory=/var/www/dinotrack/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=130
redirect_stderr=true
stdout_logfile=/var/www/dinotrack/backend/storage/logs/worker-notifications.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[group:dinotrack-workers]
programs=dinotrack-default,dinotrack-network,dinotrack-notifications
